# /etc/nginx/sites-enabled/odoiporiko.com.conf — Οδοιπορικό (docker compose stack on 127.0.0.1:4002).
# odoiporiko.com is the address; www and the typo domain odiporiko.com redirect to it.
# Step 1 only (before the certificate exists): serves the Let's Encrypt challenge. Then use nginx-odoiporiko.com.conf.

server {
    listen 80;
    listen [::]:80;
    server_name odoiporiko.com www.odoiporiko.com odiporiko.com www.odiporiko.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://odoiporiko.com$request_uri; }
}

# /etc/nginx/sites-enabled/odoiporiko.com.conf — Οδοιπορικό (docker compose stack on 127.0.0.1:4002).
# odoiporiko.com is the address; www and the typo domain odiporiko.com redirect to it.
# Certificate (with the http-only file in place): sudo certbot certonly --webroot -w /var/www/html -d odoiporiko.com -d www.odoiporiko.com -d odiporiko.com -d www.odiporiko.com

server {
    listen 80;
    listen [::]:80;
    server_name odoiporiko.com www.odoiporiko.com odiporiko.com www.odiporiko.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://odoiporiko.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.odoiporiko.com odiporiko.com www.odiporiko.com;
    ssl_certificate /etc/letsencrypt/live/odoiporiko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odoiporiko.com/privkey.pem;
    return 301 https://odoiporiko.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name odoiporiko.com;
    ssl_certificate /etc/letsencrypt/live/odoiporiko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odoiporiko.com/privkey.pem;
    client_max_body_size 20m;   # photo uploads (resized in the browser to ≤2400px first)

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

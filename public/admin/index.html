<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Διαχείριση – Κύπρος Αγίων Γη</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/style.css">
<style>
  .admin-main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; }
  .admin-main h1 { font-size: 26px; margin: 0; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .admin-badge { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; background: var(--accent); color: #fff; border-radius: 4px; padding: 2px 6px; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: 16px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--bg); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg); }
  td .thumb { width: 44px; height: 44px; }
  .status { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .status.on { background: #e3f1e4; color: #24632b; }
  .status.off { background: #f1ece2; color: var(--muted); }
  .list-filter { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 240px; }

  .editor { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; margin-top: 16px; align-items: start; }
  .field { display: grid; gap: 4px; }
  .field > span { font-size: 13px; font-weight: 600; }
  .field small { color: var(--muted); font-size: 12px; }
  .field input:not([type=checkbox]), .field select, .field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .field textarea { resize: vertical; line-height: 1.5; }
  .field textarea.tall { min-height: 320px; font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stack { display: grid; gap: 14px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
  #pick-map { height: 300px; border-radius: 8px; cursor: crosshair; }
  .lang-pane[hidden] { display: none; }

  .photos { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .photo { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .photo img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; }
  .photo .field input { padding: 5px 8px; font-size: 13px; }
  .photo .row { gap: 6px; }
  .photo .btn { min-height: 28px; padding: 0 8px; font-size: 13px; }
  .dropzone { border: 2px dashed var(--line); border-radius: 8px; padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }
  .dropzone.over { border-color: var(--accent); background: #fbf3f3; }

  .savebar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px; margin: 24px -16px 0; display: flex; gap: 10px; align-items: center; z-index: 500; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 2000; box-shadow: var(--shadow); }
  .toast.error { background: #a3271b; }

  .login { max-width: 360px; margin: 14vh auto; display: grid; gap: 14px; }
  .login h1 { text-align: center; }

  @media (max-width: 900px) {
    .editor { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="brand-text">Κύπρος – Αγίων Γη</span></a>
  <span class="admin-badge">Διαχείριση</span>
  <nav class="topbar-actions">
    <a class="btn btn-ghost" href="/" target="_blank">Δημόσιος χάρτης ↗</a>
    <button class="btn btn-ghost" id="logout" type="button" hidden>Αποσύνδεση</button>
  </nav>
</header>
<main class="admin-main" id="view"></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/common.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>

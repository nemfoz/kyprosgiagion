# docker compose up -d --build   (on the server; secrets in .env next to this file — see README "Self-hosting")
services:
  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL}
        APP_BUILD_ID: ${APP_BUILD_ID:-docker}
    image: odoiporiko:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
      REQUIRE_EMAIL: "1"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${PORT:-3100}:3000"
